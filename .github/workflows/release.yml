name: Release
run-name: Release ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: V-prefixed private source tag to release
        required: true
        type: string

concurrency:
  group: release-${{ inputs.source_ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Validate source and prepare draft
    runs-on: ubuntu-22.04
    environment: release
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      release_url: ${{ steps.prepare.outputs.release_url }}
    steps:
      - name: Check out release host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: release-host
          persist-credentials: false

      - name: Check out private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leftautomated/macroni-source
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.MACRONI_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        run: node release-host/scripts/validate-source-release.mjs "$SOURCE_REF"

      - name: Run frontend quality gates
        working-directory: source
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Resolve source commit
        id: source
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render release notes
        working-directory: source
        run: node scripts/render-release-notes.mjs "$SOURCE_REF" "$RUNNER_TEMP/release-notes.md"

      - name: Prepare clean draft release
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node release-host/scripts/prepare-release.mjs \
            "$SOURCE_REF" \
            "$RUNNER_TEMP/release-notes.md" \
            "$SOURCE_SHA"

      - name: Summarize preparation
        env:
          DRAFT_URL: ${{ steps.prepare.outputs.release_url }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo "## Release prepared"
            echo
            echo "- Source tag: \`$SOURCE_REF\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Draft: $DRAFT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS arm64
            assetArch: arm64
            assetNamePattern: macroni-v[version]-macos-arm64[setup][ext]
            bundleArgs: ""
            signingArgs: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS x64
            assetArch: x64
            assetNamePattern: macroni-v[version]-macos-x64[setup][ext]
            bundleArgs: ""
            signingArgs: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x64
            assetArch: x64
            assetNamePattern: macroni-v[version]-windows-x64[setup][ext]
            bundleArgs: ""
            signingArgs: "--config src-tauri/tauri.windows-signing.conf.json"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux x64
            assetArch: x64
            assetNamePattern: macroni-v[version]-linux-x64[setup][ext]
            bundleArgs: "--bundles deb,appimage"
            signingArgs: ""

    runs-on: ${{ matrix.platform }}
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leftautomated/macroni-source
          ref: ${{ inputs.source_ref }}
          path: source
          ssh-key: ${{ secrets.MACRONI_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: source/src-tauri

      - name: Install Linux native dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxdo-dev \
            libxi-dev \
            libxtst-dev \
            nasm \
            pkg-config \
            wget

      - name: Install NASM (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install nasm

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: choco install nasm --yes --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sign in to Azure
        if: matrix.platform == 'windows-latest'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Artifact Signing module
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Repository PSGallery -Force

      - name: Signing preflight
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
        run: |
          foreach ($name in 'AZURE_ARTIFACT_SIGNING_ENDPOINT','AZURE_ARTIFACT_SIGNING_ACCOUNT','AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Variable '$name' is empty. Is it set on the 'release' environment, and does the job declare 'environment: release'?"
            }
          }
          Import-Module ArtifactSigning -RequiredVersion 0.1.8 -ErrorAction Stop
          az account show --output none
          Write-Host "Signing preflight OK"

      - name: Updater signing preflight
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is empty" >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty" >&2; exit 1; }

      - name: Make clang_rt discoverable (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          RT=$(find /Applications/Xcode*.app /Library/Developer/CommandLineTools \
                 -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          if [ -n "$RT" ]; then
            echo "clang_rt found: $RT"
            echo "LIBRARY_PATH=$(dirname "$RT"):${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          else
            echo "::warning::libclang_rt.osx.a not found on the runner"
          fi

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: leftautomated
          repo: macroni-releases
          projectPath: source
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseAssetNamePattern: ${{ matrix.assetNamePattern }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} ${{ matrix.signingArgs }}

      - name: Notarize and staple macOS disk image
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          DMG=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -type f -name '*.dmg' -print -quit)
          test -n "$DMG" || { echo "No macOS DMG was produced" >&2; exit 1; }

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG"

          VERSION="${SOURCE_REF#v}"
          ASSET_NAME="macroni-v${VERSION}-macos-${{ matrix.assetArch }}.dmg"
          NORMALIZED_DMG="$RUNNER_TEMP/$ASSET_NAME"
          cp "$DMG" "$NORMALIZED_DMG"

          ASSET_ID=$(gh api \
            "/repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}/assets?per_page=100" \
            --jq ".[] | select(.name == \"$ASSET_NAME\") | .id")
          test -n "$ASSET_ID" || {
            echo "Uploaded draft asset $ASSET_NAME was not found." >&2
            exit 1
          }
          gh api \
            --method DELETE \
            "/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          curl --fail-with-body \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$NORMALIZED_DMG" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}/assets?name=$ASSET_NAME"

      - name: Print signing log
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'sign-windows.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'No signing log was produced.' }

      - name: Verify Windows signatures
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1

  finalize:
    name: Assemble and verify draft
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out release host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assemble updater metadata and verify the draft
        id: finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node scripts/finalize-release.mjs "$SOURCE_REF"

      - name: Summarize verified draft
        env:
          ASSET_COUNT: ${{ steps.finalize.outputs.asset_count }}
          RELEASE_URL: ${{ steps.finalize.outputs.release_url }}
        run: |
          {
            echo "## Draft verified"
            echo
            echo "- Release: $RELEASE_URL"
            echo "- Assets: $ASSET_COUNT"
            echo "- Status: ready for protected manual publication"
          } >> "$GITHUB_STEP_SUMMARY"
